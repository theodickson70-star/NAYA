# NAYA — kujenga APK ya Android kwenye GitHub (bure). Inaendeshwa kila mabadiliko ya mobile/ yakipushiwa main,
# au kwa mkono: GitHub → Actions → "NAYA Android (APK)" → Run workflow.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON   (lazima kwa kengele) maandishi yote ya google-services.json kutoka Firebase
#   NAYA_KEYSTORE_BASE64   (si lazima) keystore ya kusaini, kama base64 — kwa toleo la Play Store
#   NAYA_KEYSTORE_PASSWORD, NAYA_KEY_ALIAS, NAYA_KEY_PASSWORD   (pamoja na keystore)
name: NAYA Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # kuweka APK kwenye "Releases" ili madereva waipakue kwa link moja

concurrency:
  group: naya-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Ufunguo wa "debug" unahifadhiwa kati ya builds — ili APK mpya isakinike juu ya ya zamani bila kuifuta.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: naya-debug-keystore-v1

      - name: Sakinisha Capacitor
        run: npm ci

      - name: Andaa mradi wa Android
        run: npx cap sync android

      - name: Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            grep -q '"package_name": *"tz.naya.app"' android/app/google-services.json \
              || { echo "::error::google-services.json si ya app tz.naya.app — sajili app ya Android yenye package tz.naya.app kwenye Firebase"; exit 1; }
            echo "Firebase: ipo"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON haipo — APK itafanya kazi, lakini bila kengele ya maombi app ikiwa imefungwa."
          fi

      - name: Keystore ya kusaini (si lazima)
        env:
          NAYA_KEYSTORE_BASE64: ${{ secrets.NAYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NAYA_KEYSTORE_BASE64" ]; then
            printf '%s' "$NAYA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/naya.jks"
            echo "NAYA_KEYSTORE_FILE=$RUNNER_TEMP/naya.jks" >> "$GITHUB_ENV"
            echo "Toleo: release (imesainiwa kwa keystore ya NAYA)"
          else
            echo "Toleo: debug (kwa majaribio na kusambaza moja kwa moja)"
          fi

      - name: Jenga APK
        working-directory: mobile/android
        env:
          NAYA_VERSION_CODE: ${{ github.run_number }}
          NAYA_KEYSTORE_PASSWORD: ${{ secrets.NAYA_KEYSTORE_PASSWORD }}
          NAYA_KEY_ALIAS: ${{ secrets.NAYA_KEY_ALIAS }}
          NAYA_KEY_PASSWORD: ${{ secrets.NAYA_KEY_PASSWORD }}
        run: |
          if [ -n "$NAYA_KEYSTORE_FILE" ]; then
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NAYA.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/NAYA-playstore.aab"
          else
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/NAYA.apk"
          fi
          ls -la "$RUNNER_TEMP"/NAYA*

      - name: Hifadhi APK (Actions → run hii → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NAYA-android-1.0.${{ github.run_number }}
          path: |
            ${{ runner.temp }}/NAYA.apk
            ${{ runner.temp }}/NAYA-playstore.aab
          if-no-files-found: ignore

      - name: Weka kwenye Releases (link ya kupakua kwa madereva)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: NAYA Android 1.0.${{ github.run_number }}
          body: |
            APK ya NAYA. Pakua NAYA.apk kwenye simu ya Android na uisakinishe.
            Link ya toleo la karibuni daima: https://github.com/${{ github.repository }}/releases/latest/download/NAYA.apk
          files: ${{ runner.temp }}/NAYA.apk
          make_latest: 'true'
